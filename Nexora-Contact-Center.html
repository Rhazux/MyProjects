  const articles = [
    {id:'kb1',title:'Jak správně vést první hovor',category:'Zákaznická péče',icon:'phone',summary:'Od přivítání po shrnutí dalších kroků. Praktický průvodce profesionální komunikací.',author:'a1',updated:'2026-09-22',minutes:4,views:128,helpful:24,content:'# První dojem začíná nasloucháním\nPředstavte se jménem a uveďte svůj tým. Dejte zákazníkovi prostor popsat situaci vlastními slovy. Než přejdete k řešení, ověřte, zda jste správně pochopili, s čím potřebuje pomoci.\n\n## 1. Zorientujte se v kontextu\nOtevřete profil zákazníka v CRM. Projděte otevřené požadavky a poslední poznámky. Zákazník by neměl muset opakovat to, co už týmu sdělil.\n\n## 2. Ptejte se konkrétně\nZeptejte se, kdy problém vznikl, koho ovlivňuje a jaký výsledek zákazník očekává. Zjištěné informace průběžně zapisujte do požadavku. Hesla ani platební údaje do poznámek nepatří.\n\n## 3. Domluvte další krok\nStručně shrňte zjištění. Uveďte, kdo se případu ujme a kdy se zákazníkovi ozvete. Slibujte pouze termín, který jste schopni splnit.\n\n## 4. Uzavřete záznam\nDoplňte poznámku k hovoru, propojte související dokumenty a vytvořte navazující úkol. Záznam má být srozumitelný i kolegovi, který hovor neslyšel.'},
    {id:'kb2',title:'Priorita požadavku a práce se SLA',category:'Procesy a SLA',icon:'timer',summary:'Rozlišení priorit, odpovědnost za požadavek a správný postup při eskalaci.',author:'a3',updated:'2026-09-20',minutes:5,views:96,helpful:18,content:'# Každý požadavek má jasného vlastníka\nPriorita odráží dopad a naléhavost, nikoli pouze pořadí doručení. Následující pravidla jsou ukázkovým interním postupem této demo organizace.\n\n## Kritická priorita\nRozsáhlý výpadek nebo závažná překážka běžného provozu. Přidělte specialistu a informujte vedoucího týmu. Dohodněte pravidelnou aktualizaci stavu.\n\n## Vysoká priorita\nVýznamná funkce nepracuje správně, ale existuje dočasné náhradní řešení. Ověřte rozsah a založte konkrétní plán řešení.\n\n## Běžná a nízká priorita\nBěžná priorita patří obvyklým dotazům a dílčím problémům. Nízká priorita administrativním úpravám bez okamžitého dopadu.\n\n## Když se blíží termín\nSledujte termín u požadavku. Před eskalací přidejte shrnutí dosavadních kroků a všechny důležité podklady. Převzetí musí mít konkrétního vlastníka.\n\n## Zákazník musí vědět, co se děje\nPokud termín nedodržíte, informujte zákazníka před jeho uplynutím. Vysvětlete aktuální stav a nový ověřený postup. Nezaměňujte interní termín dema za skutečnou smluvní garanci.'},
    {id:'kb3',title:'Dokumenty: verze, štítky a přehled',category:'Dokumenty',icon:'folder',summary:'Udržujte smlouvy a podklady uspořádané. Jeden dokument, úplná historie změn.',author:'a4',updated:'2026-09-18',minutes:3,views:84,helpful:16,content:'# Dokument patří ke svému kontextu\nSoubor zařaďte do vhodné složky a propojte ho se zákazníkem. Název by měl stručně popisovat obsah, ne pouze datum nebo interní zkratku.\n\n## Doporučené pojmenování\nPoužívejte například „Servisní smlouva — název zákazníka.pdf“. Identifikátor verze spravuje DMS; nevytvářejte řadu souborů označených jako final, final2 nebo final-opravdu.\n\n## Nová verze\nV detailu dokumentu vyberte Nová verze a nahrajte aktualizovaný soubor. Starší verze zůstanou dostupné v historii. Předchozí soubor nepřepisujte bez možnosti dohledat změnu.\n\n## Štítky a souvislosti\nDoplňte několik relevantních štítků. Dokument lze připojit k požadavku, aby ho další operátor nemusel znovu hledat.\n\n## Citlivé dokumenty\nOznačení Důvěrné v této lokální ukázce je pouze evidenční. Skutečné řízení přístupu musí zajišťovat produkční server. Do demonstrační aplikace nevkládejte skutečné osobní ani citlivé údaje.'},
    {id:'kb4',title:'Obnovení přístupu zákazníka',category:'Technická podpora',icon:'shield',summary:'Bezpečný způsob ověření žádosti a předání případu správnému týmu.',author:'a5',updated:'2026-09-21',minutes:4,views:112,helpful:21,content:'# Postupujte přes ověřený proces\nTento článek popisuje ukázkový provozní postup, nikoli skutečně připojenou službu. Nikdy nevyžadujte po zákazníkovi jeho heslo.\n\n## Upřesnění problému\nRozlište zapomenuté heslo, zablokovaný účet, problém s druhým faktorem a chybějící oprávnění. Zkontrolujte, zda už neexistuje otevřený požadavek.\n\n## Ověření identity\nPoužijte schválenou firemní metodu ověření. Nespoléhejte pouze na zobrazené telefonní číslo ani na údaje, které jsou veřejně dostupné.\n\n## Obnova\nSměrujte zákazníka na ověřený oficiální proces obnovy. V této aplikaci se žádné obnovovací e-maily neposílají a nevytvářejí se skutečné přístupy.\n\n## Dokumentace\nZapište druh potíží, použitý schválený postup a výsledek. Neukládejte jednorázové kódy, hesla ani kopie citlivých ověřovacích údajů.\n\n## Podezřelé okolnosti\nNestandardní žádost předejte odpovědnému bezpečnostnímu týmu. Nesnažte se obejít kontrolu identity kvůli časovému tlaku.'},
    {id:'kb5',title:'Předání zákazníka mezi týmy',category:'Zákaznická péče',icon:'users',summary:'Plynulé předání bez opakovaného vysvětlování a ztracených informací.',author:'a2',updated:'2026-09-16',minutes:3,views:73,helpful:14,content:'# Předávejte kontext, ne jen požadavek\nDobré předání zkracuje řešení a zákazníkovi šetří čas. Než změníte odpovědný tým, připravte krátké a věcné shrnutí.\n\n## Shrnutí pro kolegu\nUveďte, co zákazník potřebuje, jaký má problém dopad, co už bylo ověřeno a jaký další krok jste mu slíbili. Připojte pouze relevantní podklady.\n\n## Domluva převzetí\nOvěřte dostupnost kolegy a jasně určete nového vlastníka. Požadavek bez vlastníka není předaný.\n\n## Informace zákazníkovi\nVysvětlete důvod předání a řekněte, kdo bude pokračovat. Upozorněte, že kolega už dostal potřebný kontext.\n\n## Po předání\nDoplňte interní poznámku a zkontrolujte navazující termín. Pokud jde o otevřený obchodní případ, aktualizujte i vlastníka souvisejícího úkolu.'},
    {id:'kb6',title:'Začínáme s Nexorou',category:'Začínáme',icon:'sparkles',summary:'Váš pracovní prostor od prvního přihlédnutí po vyřešený zákaznický požadavek.',author:'a1',updated:'2026-09-24',minutes:5,views:156,helpful:32,content:'# Vítejte ve svém pracovním prostoru\nNexora v této verzi představuje interaktivní lokální ukázku kontaktního centra. Data jsou fiktivní. Všechny změny zůstávají v prohlížeči na tomto zařízení.\n\n## Přehled\nDashboard shrnuje ukázkové provozní metriky, živé hovory, dostupnost týmu a vaše úkoly. Historické agregace v grafech jsou demonstrační a nezávisí na jednotlivých ukázkových záznamech.\n\n## CRM a požadavky\nZačněte profilem zákazníka. Z něj můžete založit požadavek, vytvořit úkol nebo spustit simulovaný hovor. Odpovědi se ukládají lokálně a zákazníkům se neodesílají.\n\n## DMS\nNahrajte testovací dokument, přiřaďte ho zákazníkovi a vyzkoušejte verzování. Soubory se ukládají do úložiště prohlížeče, nikoli do cloudu.\n\n## Rychlá navigace\nKlávesovou zkratkou Ctrl+K nebo Cmd+K otevřete globální hledání. Prohledává zákazníky, požadavky, dokumenty i moduly. Escape zavře otevřené okno.\n\n## Záloha\nV Nastavení → Data a zabezpečení vytvořte JSON zálohu včetně nahraných souborů. Vymazáním dat prohlížeče můžete o lokální změny přijít. Pro skutečný provoz je nutný backend, autentizace a napojení komunikačních kanálů.'}

async function db(){if(!globalThis.indexedDB)throw Error('Prohlížeč nepodporuje ukládání souborů. Otevřete aplikaci přes lokální server.');if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(DB_STORE))r.result.createObjectStore(DB_STORE,{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(Error('Úložiště dokumentů není dostupné.'));r.onblocked=()=>reject(Error('Zavřete druhou kartu aplikace a zkuste znovu.'))});return dbPromise}

function handleRoute(){const r=location.hash.slice(1).split('?')[0];U.route=routes.some(x=>x[0]===r)?r:'dashboard';U.q='';U.mobile=false;render();window.scrollTo(0,0)}
function sparkline(values,index){const width=88,height=33,min=Math.min(...values)*.97,max=Math.max(...values)*1.015,span=max-min||1,points=values.map((v,i)=>[i*width/(values.length-1),height-(v-min)/span*height]);const path=smoothPath(points);return`<svg class="sparkline" viewBox="0 0 88 37" aria-hidden="true"><defs><linearGradient id="spark${index}" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#99bb98" stop-opacity=".2"/><stop offset="100%" stop-color="#a7c4a3" stop-opacity="0"/></linearGradient></defs><path d="${path} L88 37 L0 37Z" fill="url(#spark${index})"/><path d="${path}" fill="none" stroke="#a4bea0" stroke-width="1.6" stroke-linecap="round"/></svg>`}
function smoothPath(p){if(!p.length)return'';let d=`M${p[0][0].toFixed(2)} ${p[0][1].toFixed(2)}`;for(let i=0;i<p.length-1;i++){const a=p[Math.max(0,i-1)],b=p[i],c=p[i+1],z=p[Math.min(p.length-1,i+2)],t=.15;d+=` C${(b[0]+(c[0]-a[0])*t).toFixed(2)} ${(b[1]+(c[1]-a[1])*t).toFixed(2)} ${(c[0]-(z[0]-b[0])*t).toFixed(2)} ${(c[1]-(z[1]-b[1])*t).toFixed(2)} ${c[0].toFixed(2)} ${c[1].toFixed(2)}`}return d}
function metricCards(n){const st=stats(n),prev=st.previous,compare=n===1?'oproti včerejšku':`oproti předchozím ${n} dnům`;const fields=[{label:'Obsloužené hovory',ic:'phone-in',value:num(st.handled),trend:prev.handled?((st.handled-prev.handled)/prev.handled*100):0,suffix:' %',upGood:true,data:S.history.slice(-12).map(x=>x.handled)}, {label:'Dodržení SLA',ic:'shield',value:decimal(st.sla)+'<span class="stat-unit">%</span>',trend:st.sla-prev.sla,suffix:' p. b.',upGood:true,data:S.history.slice(-12).map(x=>x.sla)}, {label:'Průměrná délka hovoru',ic:'clock',value:`${Math.floor(st.aht/60)}<span class="stat-unit">m</span> ${Math.round(st.aht%60)}<span class="stat-unit">s</span>`,trend:st.aht-prev.aht,suffix:' s',upGood:false,data:S.history.slice(-12).map(x=>x.aht)}, {label:'Spokojenost zákazníků',ic:'smile',value:decimal(st.csat)+'<span class="stat-unit">/ 5</span>',trend:st.csat-prev.csat,suffix:'',upGood:true,data:S.history.slice(-12).map(x=>x.csat)}];return`<div class="stats-grid">${fields.map((f,i)=>`<article class="card stat-card"><div class="stat-top"><span>${f.label}</span><span class="stat-icon">${icon(f.ic)}</span></div><div class="stat-main"><span class="stat-value">${f.value}</span>${sparkline(f.data,i)}</div><div class="stat-bottom">${st.hasPrevious?`<span class="stat-trend ${(f.upGood?f.trend<0:f.trend>0)?'negative':''}">${icon(f.trend<0?'down':'up')}${f.trend>0?'+':''}${decimal(f.trend,i===2?0:1)}${f.suffix}</span><span class="comparison">${compare}</span>`:'<span class="comparison">Demonstrační provozní agregace</span>'}</div></article>`).join('')}</div>`}
function chartData(n,mode='calls'){if(n===1){return mode==='calls'?{labels:['8:00','9:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00'],a:[12,26,38,29,45,34,25,21,16,11,8],b:[10,24,36,27,42,32,24,20,15,10,8]}:{labels:['8:00','9:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00'],a:[4,6,7,5,10,9,6,5,4,3,2],b:[3,4,6,5,8,7,5,4,3,3,2]}}const arr=S.history.slice(-n);return{labels:arr.map(d=>fmtDate(d.date,{day:'numeric',month:'numeric'})),a:arr.map(d=>mode==='calls'?d.total:d.tickets),b:arr.map(d=>mode==='calls'?d.handled:Math.round(d.tickets*.83))}}
function chartSVG(data,chartID='activity'){const W=640,H=218,left=31,right=14,top=17,bottom=29,plotW=W-left-right,plotH=H-top-bottom,max=Math.ceil(Math.max(...data.a,...data.b)/5)*5+5;const getPoints=arr=>arr.map((v,i)=>[left+i*plotW/(arr.length-1||1),top+plotH-v/max*plotH]);const p1=getPoints(data.a),p2=getPoints(data.b),path1=smoothPath(p1),path2=smoothPath(p2);return`<div class="chart-wrap"><svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${U.chartMode==='tickets'?'Požadavky':'Hovory'}: příchozí ${num(data.a.reduce((a,b)=>a+b,0))}, zpracované ${num(data.b.reduce((a,b)=>a+b,0))}. Ukázková data."><defs><linearGradient id="area-${chartID}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#a2c3a8" stop-opacity=".15"/><stop offset="1" stop-color="#a2c3a8" stop-opacity=".015"/></linearGradient></defs>${Array.from({length:5},(_,i)=>{const y=top+i*plotH/4;return`<line x1="${left}" y1="${y}" x2="${W-right}" y2="${y}" stroke="#eef2ee" stroke-dasharray="3 4"/><text x="${left-11}" y="${y+3}" text-anchor="end">${Math.round(max*(1-i/4))}</text>`}).join('')}<path d="${path1} L${W-right} ${H-bottom} L${left} ${H-bottom}Z" fill="url(#area-${chartID})"/><path d="${path2}" fill="none" stroke="#c1d6c3" stroke-width="2.1"/><path d="${path1}" fill="none" stroke="#58816c" stroke-width="2.3" stroke-linecap="round"/>${data.labels.map((l,i)=>{const x=left+i*plotW/(data.labels.length-1||1);return`${(i%Math.ceil(data.labels.length/7)===0||i===data.labels.length-1)?`<text x="${x}" y="${H-8}" text-anchor="${i===0?'start':i===data.labels.length-1?'end':'middle'}">${e(l)}</text>`:''}<rect x="${x-plotW/(data.labels.length-1||1)/2}" y="${top}" width="${plotW/(data.labels.length-1||1)}" height="${plotH}" fill="transparent" data-chart-label="${e(l)}" data-a="${data.a[i]}" data-b="${data.b[i]}"/>`}).join('')}</svg><div class="chart-tooltip"></div></div>`}

function teamDonut(){const states=['available','busy','break','offline'],col=['#729b80','#d2ba86','#a5b5ce','#e5e9e7'],total=S.agents.length||1;let pos=0;const conic=states.map((s,i)=>{const start=pos;pos+=S.agents.filter(a=>a.status===s).length/total*100;return`${col[i]} ${start}% ${pos}%`}).join(',');return`<div class="team-ring-wrap"><div class="donut" style="background:conic-gradient(${conic})" role="img" aria-label="Dostupnost ${S.agents.length} operátorů"><div class="donut-label"><strong>${S.agents.length}</strong><span>operátorů celkem</span></div></div><div class="donut-legend">${states.map((s,i)=>`<div class="donut-legend-row"><span class="dot" style="background:${col[i]}"></span><span>${({available:'Dostupní',busy:'V hovoru',break:'Přestávka',offline:'Offline'})[s]}</span><b>${S.agents.filter(a=>a.status===s).length}</b></div>`).join('')}</div></div>`}

ed.has(d.id)?'checked':''}></td><td><button class="table-link cell-person" data-action="open-document" data-id="${e(d.id)}">${fileIcon(d)}<span><span class="name" style="font-size:10px">${e(d.name)} ${d.confidential?icon('lock','tiny'):''}</span><span class="secondary" style="display:block">${e(customer(d.customer)?.company||d.folder)}</span></span></button></td><td class="tiny">${bytes(d.size)}</td><td class="tiny">${fmtDate(d.updated)}</td><td><span class="tag" style="font-size:9px;padding:2px 6px">v${d.version}.0</span></td><td><div class="flex" style="gap:3px">${ibtn('star','favorite-document',d.favorite?'Odebrat z oblíbených':'Přidat do oblíbených',`data-id="${e(d.id)}" style="${d.favorite?'color:#bda16c':''}"`)}${ibtn('download','download-document','Stáhnout dokument',`data-id="${e(d.id)}"`)}</div></td></tr>`).join('')||`<tr><td colspan="6">${empty('Tady zatím nic není','Nahrajte dokument nebo zkuste jiný filtr.','folder',btn('Nahrát dokument','upload-document','upload','soft small'))}</td></tr>`}</tbody></table></div>`}<div class="card-footer"><span class="tiny muted">${docs.length} dokumentů · ${U.folder==='all'?'Celá knihovna':U.folder==='favorites'?'Oblíbené':e(U.folder)}</span><span class="tiny muted">${icon('database')} Uloženo v tomto prohlížeči</span></div></section></div></div>`}
function taskRows(tasks){return tasks.map(t=>`<div class="task-full-row ${t.done?'completed':''}"><input type="checkbox" class="task-check" data-change="task-done" data-id="${e(t.id)}" ${t.done?'checked':''} aria-label="${t.done?'Znovu otevřít':'Dokončit'} úkol ${e(t.title)}"><button class="task-open" data-action="edit-task" data-id="${e(t.id)}" style="flex:1"><div class="task-name">${e(t.title)}</div><div class="task-meta">${icon('calendar')}<span class="${!t.done&&dateObj(t.due).getTime()<now().getTime()?'amber':''}">${fmtDate(t.due)} · ${e(t.due.slice(11,16))}</span><span>·</span><span>${e(customer(t.customer)?.company||'Interní úkol')}</span></div></button>${priority(t.priority)}${avatar(agent(t.owner),'sm')}${ibtn('more','edit-task','Upravit úkol',`data-id="${e(t.id)}"`)}</div>`).join('')||empty('Tady máte hotovo','Založte nový úkol nebo změňte filtr.','check-circle',btn('Nový úkol','new-task','plus','soft small'))}
function tasksView(){const tasks=S.tasks.filter(t=>(U.taskFilter==='all'||U.taskFilter==='open'&&!t.done||U.taskFilter==='done'&&t.done)&&(U.taskOwner==='all'||U.taskOwner===t.owner)&&contains([t.title,t.note,customer(t.customer)?.company].join(' '),U.q)).sort((a,b)=>a.due.localeCompare(b.due)),weekStart=new Date('2026-09-21T12:00:00+02:00');weekStart.setDate(weekStart.getDate()+7*U.weekOffset);return`${pageHeader('Úkoly a plánování','Jasné další kroky. Méně zapomenutých slibů, více spokojených zákazníků.',btn('<span class="desktop-text">Nový úkol</span>','new-task','plus','primary'))}<div class="mini-stats"><div class="mini-stat">${icon('calendar')}<span class="mini-stat-value">${S.tasks.filter(t=>!t.done).length}<span class="mini-stat-label">otevřených úkolů</span></span></div><div class="mini-stat">${icon('clock')}<span class="mini-stat-value">${S.tasks.filter(t=>!t.done&&t.due.slice(0,10)===localDate()).length}<span class="mini-stat-label">na dnešek</span></span></div><div class="mini-stat">${icon('check-circle')}<span class="mini-stat-value">${S.tasks.filter(t=>t.done).length}<span class="mini-stat-label">dokončených</span></span></div></div><section class="card"><div class="toolbar"><div class="toolbar-left">${searchField('Hledat v úkolech…')}<select class="filter-select" data-change="task-filter" aria-label="Stav úkolů">${opts({open:'Otevřené úkoly',all:'Všechny úkoly',done:'Dokončené'},U.taskFilter)}</select><select class="filter-select" data-change="task-owner" aria-label="Vlastník úkolů">${opts({all:'Celý tým',...Object.fromEntries(S.agents.map(a=>[a.id,a.name]))},U.taskOwner)}</select></div><div class="toolbar-right"><div class="segment-control"><button class="${U.taskView==='list'?'active':''}" data-action="task-view" data-value="list">${icon('list')} Seznam</button><button class="${U.taskView==='week'?'active':''}" data-action="task-view" data-value="week">${icon('calendar')} Týden</button></div></div></div>${U.taskView==='list'?taskRows(tasks):`<div class="toolbar"><span class="bold" style="font-size:12px">Týden od ${fmtDate(weekStart,{day:'numeric',month:'long',year:'numeric'})}</span><div class="flex">${btn('Tento týden','week-today','','small')}${ibtn('chevron-left','week-prev','Předchozí týden')}${ibtn('chevron-right','week-next','Další týden')}</div></div><div class="week-grid">${Array.from({length:7},(_,i)=>{const date=new Date(weekStart);date.setDate(date.getDate()+i);const isoDay=new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Prague'}).format(date),dayTasks=tasks.filter(t=>t.due.slice(0,10)===isoDay);return`<div class="week-day ${isoDay===localDate()?'today':''}"><div class="week-day-header">${['Pondělí','Úterý','Středa','Čtvrtek','Pátek','Sobota','Neděle'][i]}<b>${fmtDate(date,{day:'numeric'})}</b></div>${dayTasks.map(t=>`<button class="week-task ${t.done?'completed':''}" data-action="edit-task" data-id="${e(t.id)}"><span class="time">${e(t.due.slice(11,16))}</span>${e(t.title)}</button>`).join('')}<button class="week-add" data-action="new-task" data-date="${isoDay}" aria-label="Přidat úkol na ${isoDay}">+</button></div>`}).join('')}</div>`}<div class="card-footer"><span class="tiny muted">Úkoly jsou interní. Kalendářové pozvánky ani připomenutí se neodesílají.</span></div></section>`}

function reportsView(){const st=stats(U.reportPeriod),data=chartData(U.reportPeriod,'calls'),channels=[['Telefon',st.total,'#729b80'],['E-mail',st.emails,'#b1c7b4'],['Chat',st.chats,'#d1dfca'],['Portál',st.tickets,'#e9eee3']],channelTotal=channels.reduce((s,x)=>s+x[1],0);let offset=0;const grad=channels.map(c=>{const start=offset;offset+=c[1]/channelTotal*100;return`${c[2]} ${start}% ${offset}%`}).join(',');return`${pageHeader('Reporty a analytika','Měřte, co má smysl. Proměňte přehled o provozu v lepší zákaznickou péči.',btn('<span class="desktop-text">Vytisknout</span>','print','print')+btn('<span class="desktop-text">Export reportu</span>','export-report','download','primary'))}<div class="dashboard-meta"><span>Ukázková agregovaná data · ${fmtDate(st.arr[0].date)} – ${fmtDate(st.arr.at(-1).date,{day:'numeric',month:'long',year:'numeric'})}</span><div class="segment-control">${[7,30,90].map(n=>`<button class="${U.reportPeriod===n?'active':''}" data-action="report-period" data-value="${n}">${n} dní</button>`).join('')}</div></div>${metricCards(U.reportPeriod)}<div class="report-grid"><section class="card"><div class="card-header"><div><h2 class="card-title">Vývoj objemu hovorů</h2><p class="card-description">Příchozí a obsloužené hovory v čase.</p></div>${pill(U.reportPeriod+' dní','gray',true)}</div><div class="chart-legend"><span><i class="legend-dot"></i>Příchozí <b class="chart-key-value">${num(st.total)}</b></span><span><i class="legend-dot light"></i>Obsloužené <b class="chart-key-value">${num(st.handled)}</b></span></div>${chartSVG(data,'report')}<div class="chart-axis-caption"><span>Míra obsloužení ${decimal(st.handled/st.total*100)} %</span><span>${num(st.total-st.handled)} neobsloužených</span></div></section><section class="card"><div class="card-header"><div><h2 class="card-title">Komunikační kanály</h2><p class="card-description">Rozložení kontaktů v období.</p></div></div><div class="team-ring-wrap" style="padding:27px 20px"><div class="donut" style=" function teamView(){const agents=S.agents.filter(a=>(U.teamFilter==='all'||a.team===U.teamFilter)&&contains([a.name,a.team,a.email,...a.skills].join(' '),U.q));return`${pageHeader('Tým a operátoři','Lidé, kteří vytvářejí skvělou zákaznickou zkušenost.',btn('<span class="desktop-text">Přidat člena</span>','new-agent','plus','primary'))}<div class="mini-stats"><div class="mini-stat">${icon('users')}<span class="mini-stat-value">${S.agents.length}<span class="mini-stat-label">členů týmu</span></span></div>${['available','busy','break'].map(s=>`<div class="mini-stat"><span class="status-dot ${s}"></span><span class="mini-stat-value">${S.agents.filter(a=>a.status===s).length}<span class="mini-stat-label">${({available:'dostupných',busy:'v hovoru',break:'na přestávce'})[s]}</span></span></div>`).join('')}</div><section class="card" style="margin-bottom:20px"><div class="toolbar"><div class="toolbar-left">${searchField('Hledat kolegu nebo dovednost…')}<select class="filter-select" data-change="team-filter" aria-label="Oddělení">${opts({all:'Všechna oddělení',...Object.fromEntries([...new Set(S.agents.map(a=>a.team))].map(t=>[t,t]))},U.teamFilter)}</select></div><div class="toolbar-right"><div class="segment-control"><button class="${U.teamTab==='agents'?'active':''}" data-action="team-tab" data-value="agents">${icon('users')} Operátoři</button><button class="${U.teamTab==='schedule'?'active':''}" data-action="team-tab" data-value="schedule">${icon('calendar')} Rozpis směn</button></div></div></div></section>${U.teamTab==='agents'?`<div class="team-grid">${agents.map(a=>`<article class="card agent-card"><div class="between">${pill(...agentStates[a.status])}${ibtn('more','edit-agent','Upravit člena týmu',`data-id="${e(a.id)}"`)}</div>${avatar(a,'lg',true)}<h3>${e(a.name)}</h3><p class="role">${e(a.role)}</p><span class="tiny muted">${e(a.team)}</span><div class="tags">${a.skills.map(s=>`<span class="tag">${e(s)}</span>`).join('')}</div><div class="agent-metrics"><div><strong>${a.handled}</strong><span>hovorů dnes</span></div><div><strong>${decimal(a.csat)}</strong><span>CSAT / 5</span></div></div><select class="filter-select" data-change="agent-status" data-id="${e(a.id)}" aria-label="Dostupnost ${e(a.name)}">${opts(agentStates,a.status)}</select></article>`).join('')||empty('Žádní kolegové','Upravte filtr týmu nebo jméno.','users')}</div>`:`<section class="card"><div class="card-header"><div><h2 class="card-title">Týden 21.–27. září 2026</h2><p class="card-description">Ukázkový rozpis. Směnu upravíte kliknutím na příslušný den.</p></div>${pill('Lokální plán','gray',true)}</div><div class="table-scroll mt-16"><table class="data-table"><thead><tr><th>Operátor</th>${['Po 21.','Út 22.','St 23.','Čt 24.','Pá 25.','So 26.','Ne 27.'].map(t=>`<th>${t}</th>`).join('')}</tr></thead><tbody>${agents.map((a,i)=>`<tr><td><span class="cell-person">${avatar(a,'sm')}<span class="name">${e(a.name)}</span></span></td>${Array.from({length:7},(_,j)=>{const shift=a.shifts?.[j]??(j>4?'Volno':(S.agents.indexOf(a)+j)%4===0?'10:00–18:00':'8:00–16:00');return`<td><button class="heat-cell ${shift==='Volno'?'off':shift.startsWith('10')?'evening':j===3?'current':''}" style="border:0" data-action="edit-shift" data-id="${e(a.id)}" data-day="${j}" aria-label="${e(a.name)}, ${j+21}. září: ${e(shift)}">${e(shift)}</button></td>`}).join('')}</tr>`).join('')}</tbody></table></div></section>`}`}
function settingsView(){const tabs=[['workspace','Pracovní prostor','building'],['profile','Můj profil','user'],['notifications','Oznámení','bell'],['automation','Automatizace','zap'],['integrations','Integrace','code'],['data','Data a zabezpečení','shield']];return`${pageHeader('Nastavení','Váš pracovní prostor, vaše pravidla. Přizpůsobte Nexoru svému týmu.')}<div class="settings-layout"><aside class="card settings-nav">${tabs.map(([k,l,ic])=>`<button class="${U.settingsTab===k?'active':''}" data-action="settings-tab" data-value="${k}">${icon(ic)}${l}</button>`).join('')}</aside><section class="card"><div class="settings-section">${settingsContent()}</div></section></div>`}
function settingsContent(){switch(U.settingsTab){case'workspace':return`<h2>Pracovní prostor</h2><p class="subtext">Základní identita vašeho zákaznického centra.</p><div class="flex" style="margin:22px 0 26px"><span class="brand-mark" style="width:52px;height:52px;border-radius:13px">${icon('n')}</span><div><strong style="font-size:14px">${e(S.workspace.name)}</strong><p class="subtext" style="margin:3px 0 0">Lokální demonstrační prostor</p></div></div><form data-form="workspace"><div class="form-grid">${field('Název prostoru','name',S.workspace.name,'text','required maxlength="60"')}${field('Kontaktní e-mail','email',S.workspace.email,'email','required maxlength="120"')}${field('Provozní doba','hours',S.workspace.hours,'text','maxlength="80"')}${field('Časové pásmo ukázky','timezone','Europe/Prague','text','readonly')}${textareaField('Popis pracovního prostoru','description',S.workspace.description,'maxlength="1000"')}</div><div class="flex mt-24"><span class="subtext">Změny se uloží jen do tohoto prohlížeče.</span><span class="spacer"></span><button class="btn primary" type="submit">${icon('check')} Uložit změny</button></div></form>`;case'profile':return`<h2>Můj profil</h2><p class="subtext">Jméno operátora v lokálních záznamech a poznámkách.</p><div class="flex" style="margin:24px 0">${avatar({name:S.profile.name,color:0},'xl')}<div><strong>${e(S.profile.name)}</strong><p class="subtext" style="margin:4px 0">${e(S.profile.role)}</p>${pill('Lokální profil','green')}</div></div><form data-form="profile"><div class="form-grid">${field('Celé jméno','name',S.profile.name,'text','required maxlength="80"')}${field('E-mail','email',S.profile.email,'email','required maxlength="120"')}${field('Označení role','role',S.profile.role,'text','required maxlength="60"')}${selectField('Dostupnost', 'status',opts(agentStates,agent('a1')?.status||'available'))}</div><div class="note-box mt-24">Tato verze nemá přihlášení. Změna jména nebo označení role není změnou oprávnění a nevytváří skutečný uživatelský účet.</div><div class="flex mt-24"><span class="spacer"></span><button class="btn primary" type="submit">${icon('check')} Uložit profil</button></div></form>`;case'notifications':return`<h2>Oznámení v aplikaci</h2><p class="subtext">Vyberte, které nové události se objeví pod zvonečkem.</p>${[['notifyTickets','Zákaznické požadavky','Upozornění při vytvoření nového požadavku a jeho vyřešení.'],['notifyDeals','Obchodní příležitosti','Změny fáze a úspěšné uzavření obchodních případů.'],['notifyDocuments','Dokumenty a nové verze','Nově nahrané dokumenty a aktualizace souborů.']].map(([key,title,desc])=>`<div class="settings-row"><div><h3>${title}</h3><p>${desc}</p></div><input type="checkbox" class="toggle" data-change="preference" data-key="${key}" ${S.preferences[key]?'checked':''} aria-label="${title}"></div>`).join('')}<div class="note-box mt-24">Jde o oznámení uvnitř aplikace. Push notifikace, SMS a e-mailové zprávy nejsou připojené. Aplikace neběží na pozadí po zavření stránky.</div>`;case'automation':return`<h2>Automatizace požadavků</h2><p class="subtext">Jednoduchá funkční pravidla pro lokální demo.</p><div class="settings-row"><div><h3>Automatické přiřazení nových požadavků</h3><p>Vybere dostupného operátora s nejmenším počtem nevyřešených požadavků. Když nikdo není dostupný, použije zvoleného řešitele.</p></div><input type="checkbox" class="toggle" data-change="preference" data-key="autoAssign" ${S.preferences.autoAssign?'checked':''} aria-label="Automatické přiřazení"></div><h3 class="section-title mt-24">Výchozí termíny podle priority</h3><div class="table-scroll"><table class="data-table"><thead><tr><th>Priorita</th><th>Termín od založení</th></tr></thead><tbody>${[['urgent','30 minut'],['high','2 hodiny'],['normal','8 hodin'],['low','24 hodin']].map(([k,l])=>`<tr><td>${priority(k)}</td><td>${l}</td></tr>`).join('')}</tbody></table></div><div class="note-box mt-24">Pravidlo se spustí při vytvoření požadavku v otevřené aplikaci. SLA je v této ukázce pevný termín bez pracovního kalendáře; nejde o smluvně garantovanou službu.</div>`;case'integrations':return`<h2>Integrace</h2><p class="subtext">Připravené scénáře propojení. Žádná externí služba není připojená.</p>${[['phone','Telefonie / SIP PBX','Skutečné příchozí hovory, vytáčení a přepojování.','telephony'],['mail','E-mailová schránka','Příjem zpráv a skutečné odpovědi zákazníkům.','mail'],['database','Databáze a úložiště','Sdílené CRM, DMS, synchronizace a zálohy.','backend'],['shield','Přihlášení a role','Ověřená identita a serverová autorizace.','auth']].map(([ic,l,desc,key])=>`<div class="integration-card"><span class="integration-icon">${icon(ic)}</span><div><h3>${l}</h3><p>${desc}</p></div>${pill('Nepřipojeno','gray')}${btn('Postup','integration-info','arrow','small',`data-value="${key}"`)}</div>`).join('')}<div class="note-box mt-24">Do prohlížeče nevkládejte produkční hesla, SIP údaje ani tajné API klíče. Napojení musí obsluhovat serverová část s bezpečným uložením tajných údajů.</div>`;case'data':return`<h2>Data a zabezpečení</h2><p class="subtext">Přehledné hranice lokální ukázky a kontrola nad daty.</p><div class="info-banner">${icon('info')}<div><strong>Lokální režim bez serveru.</strong> Demo neobsahuje autentizaci ani ochranu skutečných zákaznických dat. Označení role nebo důvěrnosti je evidenční, ne bezpečnostní kontrola.</div></div><div class="settings-row"><div><h3>Úplná záloha pracovního prostoru</h3><p>Export JSON včetně kontaktů, požadavků, úkolů, nastavení a binárních souborů všech nahraných verzí.</p></div>${btn('Exportovat zálohu','backup','download','soft')}</div><div class="settings-row"><div><h3>Obnovit ze zálohy</h3><p>Nahradí současné lokální záznamy daty z platné zálohy Nexora. Před obnovou si stáhněte aktuální zálohu.</p></div>${btn('Importovat JSON','import-backup','upload')}</div><div class="settings-row"><div><h3>Úložiště prohlížeče</h3><p>Strukturovaná data používají localStorage, nahrané soubory IndexedDB. Vymazání dat webu může smazat i vaše záznamy.</p></div>${pill('Lokální','gray',true)}</div><div class="danger-zone"><h3>Obnovit výchozí demo</h3><p>Odstraní lokální změny i nahrané soubory a vrátí původní fiktivní data. Tato operace je nevratná.</p>${btn('Smazat změny a obnovit demo','reset-demo','refresh','danger')}</div><h3 class="section-title mt-24">Nedávná aktivita</h3><p class="subtext">Lokální historie událostí, nikoli neměnný bezpečnostní audit.</p>${S.audit.slice(0,7).map(a=>`<div class="audit-row">${icon(a.icon)}<span>${e(a.text)}</span><time>${dateTime(a.at)}</time></div>`).join('')}`;default:return''}}
/* Dialogs and detail panels */
function releasePreviews(){activeBlobURLs.forEach(u=>URL.revokeObjectURL(u));activeBlobURLs=[]}
function closeOverlay(){releasePreviews();$('#overlay-root').innerHTML='';document.body.style.overflow='';$('#app').inert=false;$('#call-root').inert=false;const f=modalReturnFocus;modalReturnFocus=null;if(f?.isConnected)f.focus({preventScroll:true})}
function showOverlay(html,drawer=false){closePopover();releasePreviews();if(!$('#overlay-root').children.length)modalReturnFocus=document.activeElement;$('#overlay-root').innerHTML=`<div class="overlay ${drawer?'drawer-overlay':''}" data-overlay-background>${html}</div>`;document.body.style.overflow='hidden';$('#app').inert=true;$('#call-root').inert=true;requestAnimationFrame(()=>{const target=$('[autofocus]',$('#overlay-root'))||$('input:not([type=hidden]):not([type=file]),textarea,select',$('#overlay-root'))||$('button',$('#overlay-root'));target?.focus({preventScroll:true})})}
function formModal(title,subtitle,formName,body,submit='Uložit',attrs='',wide=false){showOverlay(`<section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header class="modal-header"><div><h2 id="dialog-title">${e(title)}</h2><p>${e(subtitle)}</p></div>${ibtn('close','close-overlay','Zavřít okno')}</header><form data-form="${formName}" ${attrs}><div class="modal-body"><div class="form-error hidden" role="alert"></div>${body}</div><footer class="modal-footer">${btn('Zrušit','close-overlay')}<button class="btn primary" type="submit">${icon('check')}${e(submit)}</button></footer></form></section>`,false)}
function infoModal(title,body,footerButton='',wide=false){showOverlay(`<section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header class="modal-header"><h2 id="dialog-title">${e(title)}</h2>${ibtn('close','close-overlay','Zavřít okno')}</header><div class="modal-body">${body}</div><footer class="modal-footer">${footerButton}${btn('Zavřít','close-overlay')}</footer></section>`)}
function drawer(title,body,footerHTML='',actions=''){showOverlay(`<section class="drawer" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header class="drawer-header"><span id="dialog-title" class="drawer-title">${e(title)}</span><span class="spacer"></span>${actions}${ibtn('close','close-overlay','Zavřít detail')}</header><div class="drawer-body">${body}</div>${footerHTML?`<footer class="drawer-footer">${footerHTML}</footer>`:''}</section>`,true)}
function confirmModal(title,text,action,attrs='',label='Potvrdit'){showOverlay(`<section class="modal small" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header class="modal-header"><h2 id="dialog-title">${e(title)}</h2>${ibtn('close','close-overlay','Zavřít okno')}</header><div class="modal-body"><div class="note-box">${e(text)}</div></div><footer class="modal-footer">${btn('Zrušit','close-overlay')}${btn(e(label),action,'trash','danger',attrs)}</footer></section>`)}
function formError(form,err){const el=$('.form-error',form);if(el){el.textContent=err.message||String(err);el.classList.remove('hidden');el.scrollIntoView({block:'nearest'});}else toast(err.message||String(err),'error')}
function inputDT(date){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Prague',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(dateObj(date)).replace(' ','T')}
function newTicketForm(customerID='',ticketID=''){const t=S.tickets.find(x=>x.id===ticketID),due=t?inputDT(t.due):inputDT(new Date(now().getTime()+8*3600000));formModal(t?'Upravit požadavek':'Nový požadavek','Propojte dotaz se zákazníkem a domluvte jasný další krok.',t?'edit-ticket':'new-ticket',`<div class="form-grid">${field('Předmět požadavku','subject',t?.subject||'','text','required minlength="3" maxlength="180" autofocus',true)}${selectField('Zákazník','customer',optionsCustomers(t?.customer||customerID),true)}${textareaField(t?'Popis / první zpráva zákazníka':'Popis požadavku','description',t?.messages[0]?.text||'','required maxlength="10000" placeholder="S čím zákazník potřebuje pomoci?"')}${selectField('Priorita','priority',opts(priorities,t?.priority||'normal'))}${selectField('Kanál','channel',opts(channelNames,t?.channel||'email'))}${selectField('Odpovědný řešitel','assignee',optionsPeople(t?.assignee||'a1'))}${field('Termín SLA (čas ukázky)','due',due,'datetime-local','required')}</div><div class="note-box mt-16">${S.preferences.autoAssign&&!t?'Automatické přiřazení je zapnuté. Dostupný operátor s nejméně otevřenými požadavky může nahradit zvoleného řešitele.':'Požadavek se uloží do lokálního dema. Zákazníkovi se nic neodesílá.'}</div>`,t?'Uložit změny':'Vytvořit požadavek',t?`data-id="${e(t.id)}"`:'',true)}
function customerForm(customerID=''){const c=customer(customerID);formModal(c?'Upravit zákazníka':'Nový zákazník','Vytvořte přehledný základ pro každý další rozhovor.',c?'edit-customer':'new-customer',`<div class="form-grid">${field('Jméno a příjmení','name',c?.name||'','text','required maxlength="80" autofocus')}${field('Společnost','company',c?.company||'','text','required maxlength="100"')}${field('E-mail','email',c?.email||'','email','required maxlength="150" placeholder="jmeno@firma.example"')}${field('Telefon','phone',c?.phone||'','tel','maxlength="30" placeholder="+420 000 000 000"')}${field('Pozice','position',c?.position||'','text','maxlength="80"')}${selectField('Segment','status',opts({Aktivní:'Aktivní',VIP:'VIP',Potenciální:'Potenciální',Neaktivní:'Neaktivní'},c?.status||'Potenciální'))}${selectField('Vlastník vztahu','owner',optionsPeople(c?.owner||'a1'))}${field('Evidovaná hodnota vztahu (Kč)','value',c?.value||0,'number','min="0" max="1000000000" step="1" required')}${field('Štítky oddělené čárkou','tags',c?.tags.join(', ')||'','text','maxlength="300" placeholder="VIP, Integrace, Reporting"',true)}</div><div class="note-box mt-16">Používejte testovací údaje. Tato ukázka neobsahuje serverové zabezpečení osobních dat.</div>`,c?'Uložit zákazníka':'Přidat zákazníka',c?`data-id="${e(c.id)}"`:'',true)}
function openCustomer(customerID,tab){const c=customer(customerID);if(!c){toast('Zákazník již neexistuje.','error');return}if(U.customerId!==customerID)U.customerTab='overview';U.customerId=customerID;if(tab)U.customerTab=tab;const tickets=S.tickets.filter(t=>t.customer===c.id),docs=S.documents.filter(d=>d.customer===c.id),calls=S.calls.filter(x=>x.customer===c.id),deals=S.deals.filter(d=>d.customer===c.id);let content='';if(U.customerTab==='overview'){content=`<div class="detail-properties">${[['mail','E-mail',c.email],['phone','Telefon',c.phone||'Neuvedeno'],['building','Společnost',c.company],['briefcase','Pozice',c.position||'Neuvedena'],['user','Vlastník vztahu',agentName(c.owner)],['calendar','Zákazníkem od',fmtDate(c.created,{day:'numeric',month:'long',year:'numeric'})]].map(([ic,l,v])=>`<div><div class="property-label">${l}</div><div class="property-value">${icon(ic)}${e(v)}</div></div>`).join('')}</div><div class="tags">${c.tags.map(t=>`<span class="tag">${e(t)}</span>`).join('')||'<span class="subtext">Bez štítků</span>'}</div><div class="divider"></div><div class="between"><h3 class="section-title mb-0">Interní poznámky</h3><span class="tiny muted">Viditelné v lokálním demu</span></div><div class="timeline mt-16">${[...c.notes].reverse().map(n=>`<div class="timeline-item"><span class="timeline-icon">${icon('edit')}</span><div class="timeline-content"><strong>${e(agentName(n.author))}</strong><div style="white-space:pre-wrap">${e(n.text)}</div><div class="timeline-time">${dateTime(n.at)}</div></div></div>`).join('')||'<p class="subtext">Zatím bez poznámek. Přidejte první důležitou souvislost.</p>'}</div><form data-form="customer-note" data-id="${e(c.id)}"><div class="field"><label for="customer-note">Nová poznámka</label><textarea id="customer-note" name="note" required maxlength="3000" placeholder="Co by měl vědět kolega při dalším kontaktu?"></textarea></div><div class="flex mt-16"><span class="spacer"></span><button type="submit" class="btn soft">${icon('plus')} Uložit poznámku</button></div></form>${deals.length?`<div class="divider"></div><h3 class="section-title">Související příležitosti</h3>${deals.map(d=>`<button class="customer-strip" style="width:100%;margin-bottom:9px;text-align:left" data-action="edit-deal" data-id="${e(d.id)}">${icon('briefcase')}<span>${e(d.title)}<br><span class="tiny muted">${e(stages[d.stage].name)}</span></span><span class="spacer"></span><strong>${money(d.value)}</strong></button>`).join('')}`:''}`;}else if(U.customerTab==='tickets'){content=`<div class="mt-24">${tickets.map(t=>`<button class="customer-strip" style="width:100%;text-align:left;margin-bottom:12px" data-action="open-ticket" data-id="${e(t.id)}">${channel(t.channel)}<span style="flex:1">${e(t.subject)}<span class="subtext" style="display:block;margin-top:3px">NX-${t.number}</span></span>${ticketPill(t.status)}${icon('chevron-right')}</button>`).join('')||empty('Zatím žádné požadavky','Založte první dotaz pro tohoto zákazníka.','ticket',btn('Nový požadavek','new-ticket','plus','soft small',`data-customer="${e(c.id)}"`))}</div>`;}else if(U.customerTab==='documents'){content=`<div class="mt-24">${docs.map(d=>`<button class="customer-strip" style="width:100%;text-align:left;margin-bottom:12px" data-action="open-document" data-id="${e(d.id)}">${fileIcon(d)}<span style="flex:1">${e(d.name)}<span class="tiny muted" style="display:block;margin-top:4px">Verze ${d.version} · ${bytes(d.size)}</span></span>${icon('chevron-right')}</button>`).join('')||empty('Žádné propojené dokumenty','Nahrajte testovací dokument a přiřaďte jej zákazníkovi.','folder',btn('Nahrát dokument','upload-document','upload','soft small',`data-customer="${e(c.id)}"`))}</div>`;}else{const events=[...calls.map(x=>({ic:'phone',title:`${x.direction==='incoming'?'Příchozí':'Odchozí'} hovor · ${x.status==='active'?'probíhá':duration(x.duration)}`,text:agentName(x.agent)+(x.note?' · '+x.note:''),at:x.at})),...tickets.map(t=>({ic:'ticket',title:`Požadavek NX-${t.number}`,text:t.subject,at:t.created})),...c.notes.map(n=>({ic:'edit',title:'Interní poznámka',text:n.text,at:n.at}))].sort((a,b)=>b.at.localeCompare(a.at));content=`<div class="timeline mt-24">${events.map(ev=>`<div class="timeline-item"><span class="timeline-icon">${icon(ev.ic)}</span><div class="timeline-content"><strong>${e(ev.title)}</strong><div>${e(ev.text)}</div><div class="timeline-time">${dateTime(ev.at)}</div></div></div>`).join('')||empty('Historie začíná tady','Další kontakty se budou objevovat v časové ose.','history')}</div>`;}drawer('CRM / Profil zákazníka',`<div class="drawer-hero">${avatar(c,'xl')}<div><h2>${e(c.name)}</h2><p>${e(c.position)} · ${e(c.company)}</p><div class="mt-16">${customerPill(c.status)}</div></div><span class="spacer"></span>${ibtn('edit','edit-customer','Upravit zákazníka',`data-id="${e(c.id)}"`)}</div><div class="profile-metrics"><div class="profile-metric"><strong>${tickets.filter(t=>t.status!=='resolved').length}</strong><span>otevřených požadavků</span></div><div class="profile-metric"><strong>${calls.length}</strong><span>evidovaných hovorů</span></div><div class="profile-metric"><strong>${docs.length}</strong><span>dokumentů v DMS</span></div></div><div class="tabs mt-16">${[['overview','Přehled'],['tickets','Požadavky'],['documents','Dokumenty'],['history','Historie']].map(([k,l])=>`<button class="tab ${U.customerTab===k?'active':''}" data-action="customer-tab" data-value="${k}" data-id="${e(c.id)}">${l}</button>`).join('')}</div>${content}`,`<div class="flex">${btn('Zavolat (demo)','call-customer','phone','soft',`data-id="${e(c.id)}"`)}${btn('Úkol','new-task','calendar','',`data-customer="${e(c.id)}"`)}</div>${btn('Nový požadavek','new-ticket','plus','primary',`data-customer="${e(c.id)}"`)}`)}

 · ${e(agentName(v.by))} · ${bytes(v.size)}</div></div><span class="spacer"></span>${v.version===d.version?pill('Aktuální','green',true):''}${ibtn('download','download-version','Stáhnout verzi '+v.version,`data-id="${e(d.id)}" data-version="${v.version}"`)}</div>`).join('')}<p class="tiny muted mt-16">Označení důvěrnosti nenahrazuje řízení přístupu. Používejte jen testovací soubory.</p>`,`${btn('Upravit údaje','edit-document','edit','',`data-id="${e(d.id)}"`)}${btn('Stáhnout soubor','download-document','download','primary',`data-id="${e(d.id)}"`)}`,ibtn('trash','delete-document','Smazat dokument',`data-id="${e(d.id)}"`));try{const blob=await docBlob(d);if(U.docId!==docID||!$('#document-preview'))return;const root=$('#document-preview');if(blob.type==='application/pdf'){const url=URL.createObjectURL(blob);activeBlobURLs.push(url);root.innerHTML=`<iframe title="Náhled PDF: ${e(d.name)}" src="${url}#toolbar=0&navpanes=0" referrerpolicy="no-referrer"></iframe>`}else if(blob.type.startsWith('image/')){const url=URL.createObjectURL(blob);activeBlobURLs.push(url);root.innerHTML=`<img src="${url}" alt="Náhled ${e(d.name)}">`}else if(blob.type.startsWith('text/')||/\.(txt|md|csv|json|log)$/i.test(d.name)){const text=await blob.slice(0,150000).text();if(U.docId!==docID||!$('#document-preview'))return;root.innerHTML=`<pre>${e(text)}${blob.size>150000?'\n\n[Náhled zkrácen. Stáhněte celý dokument.]':''}</pre>`}else root.innerHTML=empty('Náhled není k dispozici','Tento typ souboru můžete stáhnout a otevřít ve vhodné aplikaci.','file',btn('Stáhnout','download-document','download','soft small',`data-id="${e(d.id)}"`));}catch(err){if($('#document-preview'))$('#document-preview').innerHTML=empty('Soubor nelze zobrazit',err.message,'info')}}

function startCall(number,customerID='',direction='outgoing',queueName='Zákaznická péče'){number=String(number||'').trim();if(!/^[+0-9*#()\s-]{3,25}$/.test(number)||number.replace(/\D/g,'').length<3){toast('Zadejte telefonní číslo s alespoň třemi číslicemi.','error');return false}const existing=S.calls.find(c=>c.status==='active'&&c.agent==='a1');if(existing){closeOverlay();openCall(existing.id);toast('Nejdříve ukončete nebo předejte svůj současný simulovaný hovor.','error');return false}const found=customerID?customer(customerID):S.customers.find(c=>c.phone.replace(/\D/g,'')===number.replace(/\D/g,''));const c={id:id('call'),customer:found?.id||'',number,agent:'a1',direction,status:'active',duration:0,queue:queueName,at:iso(),note:''};S.calls.unshift(c);liveStarts.set(c.id,Date.now());if(agent('a1'))agent('a1').status='busy';closeOverlay();commit('Simulovaný hovor byl zahájen.',`${S.profile.name} zahájil simulovaný hovor: ${found?.name||number}.`,'phone');openCall(c.id);return true}
function openCall(callID){const c=S.calls.find(x=>x.id===callID);if(!c)return;if(c.status!=='active'){callDetail(c.id);return}U.callId=c.id;U.callMin=false;U.hold=!!c.onHold;U.muted=!!c.muted;renderCallWidget()}
function renderCallWidget(){const c=S.calls.find(x=>x.id===U.callId&&x.status==='active');if(!c){$('#call-root').innerHTML='';return}const p=customer(c.customer)||{name:c.number||'Neznámý kontakt',color:2};$('#call-root').innerHTML=`<section class="call-floating ${U.callMin?'minimized':''}" aria-label="Ovládání simulovaného hovoru"><div class="call-floating-header"><span class="flex" style="gap:6px">${bars()}${U.hold?'Hovor je přidržený':'Probíhá simulovaný hovor'}</span><span class="spacer"></span>${ibtn(U.callMin?'chevronup':'chevron-down','minimize-call',U.callMin?'Rozbalit ovládání':'Sbalit ovládání')}</div><div class="call-floating-body"><div class="flex">${avatar(p)}<div><strong style="font-size:12px;font-weight:600">${e(p.name)}</strong><div class="tiny muted" style="margin-top:4px">${e(p.company||c.number)} · ${e(agentName(c.agent).split(' ')[0])}</div></div><span class="call-floating-time" data-timer="${e(c.id)}">${duration(callSeconds(c))}</span></div><div class="call-controls"><button class="call-control ${U.muted?'active':''}" data-action="mute-call" aria-pressed="${U.muted}"><span>${icon(U.muted?'mic-off':'mic')}</span>${U.muted?'Ztlumeno':'Ztlumit'}</button><button class="call-control ${U.hold?'active':''}" data-action="hold-call" aria-pressed="${U.hold}"><span>${icon(U.hold?'play':'pause')}</span>${U.hold?'Pokračovat':'Přidržet'}</button><button class="call-control" data-action="transfer-call"><span>${icon('transfer')}</span>Předat</button><button class="call-control end" data-action="end-call"><span>${icon('phone-end')}</span>Ukončit</button></div><div class="between" style="margin-top:16px;padding-top:12px;border-top:1px solid #edf2e8"><span class="tiny muted">Žádný přístup k mikrofonu.</span>${c.customer?btn('Profil zákazníka','open-customer','arrow','text small',`data-id="${e(c.customer)}"`):''}</div></div></section>`}
function endCall(){const c=S.calls.find(x=>x.id===U.callId);if(!c||c.status!=='active')return;c.duration=callSeconds(c);c.status='ended';c.endedAt=iso();liveStarts.delete(c.id);const a=agent(c.agent);if(a&&!S.calls.some(x=>x.status==='active'&&x.agent===a.id))a.status='available';U.callId='';U.hold=false;U.muted=false;commit('Simulovaný hovor byl ukončen.',`Ukončen simulovaný hovor s ${customer(c.customer)?.name||c.number} (${duration(c.duration)}).`,'phone');formModal('Shrnutí hovoru',`${customer(c.customer)?.name||c.number} · délka ${duration(c.duration)}`,'call-wrapup',`<div class="form-grid">${selectField('Výsledek hovoru','outcome',opts({resolved:'Vyřešeno během hovoru',followup:'Navazuje další komunikace',callback:'Domluveno zpětné zavolání'},'resolved'),true)}${textareaField('Poznámka k hovoru','note',c.note,'maxlength="5000" placeholder="Stručně popište zjištění a domluvené další kroky."')}${field('Termín případného zpětného volání','callbackDue',inputDT(new Date(now().getTime()+3600000)),'datetime-local','required',true)}${c.customer?'<label class="flex tiny muted"><input type="checkbox" name="createTicket">Po uložení založit navazující požadavek</label>':''}</div><p class="tiny muted mt-16">Zpětné volání vytvoří interní úkol. Samo hovor nezahájí.</p>`,'Uložit záznam',`data-id="${e(c.id)}"`)}
function transferForm(){const c=S.calls.find(x=>x.id===U.callId);if(!c)return;const people=S.agents.filter(a=>a.id!==c.agent&&a.status==='available');if(!people.length){toast('Žádný další operátor není dostupný.','error');return}formModal('Předat simulovaný hovor','Změní odpovědného operátora pouze v lokálním demu.','transfer',`<div class="form-grid">${selectField('Dostupný kolega','agent',opts(Object.fromEntries(people.map(a=>[a.id,a.name+' · '+a.team])),people[0].id),true)}${textareaField('Kontext pro kolegu','note','','maxlength="2000" placeholder="Co zákazník potřebuje a co už bylo ověřeno?"')}</div>`,'Předat hovor',`data-id="${e(c.id)}"`)}
function callDetail(callID){const c=S.calls.find(x=>x.id===callID);if(!c)return;formModal('Detail hovoru',`${c.status==='missed'?'Zmeškaný':'Dokončený'} · ${dateTime(c.at)}`,'call-note',`<div class="customer-strip">${avatar(customer(c.customer)||{name:c.number})}<span><strong>${e(customer(c.customer)?.name||c.number)}</strong><span class="subtext" style="display:block">${e(customer(c.customer)?.company||'Neznámý kontakt')}</span></span><span class="spacer"></span><b class="mono">${duration(c.duration)}</b></div><div class="detail-properties"><div><div class="property-label">Operátor</div><div class="property-value">${e(agentName(c.agent))}</div></div><div><div class="property-label">Směr hovoru</div><div class="property-value">${c.direction==='incoming'?'Příchozí':'Odchozí'}</div></div></div>${textareaField('Poznámka k hovoru','note',c.note,'maxlength="5000"')}<div class="flex mt-16">${c.customer?btn('Profil zákazníka','open-customer','user','soft',`data-id="${e(c.customer)}"`):''}${btn('Zavolat znovu (demo)','redial','phone','',`data-id="${e(c.id)}"`)}</div>`,'Uložit poznámku',`data-id="${e(c.id)}"`)}

function searchEntries(q){const all=[];for(const r of routes)if(!q||contains([r[0],r[1],r[2]].join(' '),q))all.push({type:'route',id:r[0],title:r[1],subtitle:'Přejít do modulu',icon:r[2],group:'Navigace'});if(q){for(const c of S.customers)if(contains([c.name,c.company,c.email,c.phone].join(' '),q))all.push({type:'customer',id:c.id,title:c.name,subtitle:c.company,icon:'users',group:'Zákazníci'});for(const t of S.tickets)if(contains([t.subject,t.number,customerName(t.customer),customer(t.customer)?.company].join(' '),q))all.push({type:'ticket',id:t.id,title:t.subject,subtitle:'NX-'+t.number+' · '+customer(t.customer)?.company,icon:'ticket',group:'Požadavky'});for(const d of S.documents)if(contains([d.name,...d.tags,customer(d.customer)?.company].join(' '),q))all.push({type:'document',id:d.id,title:d.name,subtitle:d.folder,icon:'file',group:'Dokumenty'});for(const a of S.articles)if(contains(a.title+' '+a.summary,q))all.push({type:'article',id:a.id,title:a.title,subtitle:a.category,icon:'book',group:'Znalostní báze'});for(const d of S.deals)if(contains(d.title+' '+customer(d.customer)?.company,q))all.push({type:'deal',id:d.id,title:d.title,subtitle:money(d.value),icon:'briefcase',group:'Příležitosti'})}return all.slice(0,25)}
function openSearch(){U.searchIndex=0;showOverlay(`<section class="modal search-modal" role="dialog" aria-modal="true" aria-label="Globální vyhledávání"><div class="command-input-wrap">${icon('search')}<input class="command-input" id="global-search" data-input="global-search" type="search" placeholder="Zákazník, požadavek, dokument…" autocomplete="off" autofocus aria-label="Hledat v pracovním prostoru"><button class="keycap" style="cursor:pointer" data-action="close-overlay" aria-label="Zavřít hledání">ESC</button></div><div class="command-results" id="command-results"></div><div class="command-footer"><span>↑ ↓ Vybrat</span><span>↵ Otevřít</span><span>Esc Zavřít</span><span class="spacer"></span><span>Nexora Search</span></div></section>`);renderSearchResults('')}
function renderSearchResults(q){U.searchResults=searchEntries(q);U.searchIndex=Math.min(U.searchIndex,Math.max(0,U.searchResults.length-1));let group='';const root=$('#command-results');if(!root)return;root.innerHTML=U.searchResults.map((r,i)=>{let h='';if(r.group!==group){h=`<div class="command-group-label">${e(r.group)}</div>`;group=r.group}return h+`<button class="command-result ${i===U.searchIndex?'selected':''}" data-action="search-result" data-index="${i}" id="search-result-${i}">${icon(r.icon)}<div style="min-width:0"><strong>${e(r.title)}</strong><span>${e(r.subtitle)}</span></div><span class="spacer"></span>${icon('chevron-right')}</button>`}).join('')||empty('Žádné výsledky','Zkuste jméno, společnost, číslo požadavku nebo název dokumentu.','search')}
function openSearchResult(index){const r=U.searchResults?.[index];if(!r)return;closeOverlay();openEntity(r.type,r.id)}
function openEntity(type,target){switch(type){case'route':navigate(target);break;case'customer':navigate('crm');openCustomer(target);break;case'ticket':navigate('tickets');openTicket(target);break;case'document':navigate('documents');openDocument(target);break;case'article':navigate('knowledge');openArticle(target);break;case'deal':navigate('pipeline');dealForm(target);break;case'task':navigate('tasks');taskForm(target);break}}

function helpModal(){infoModal('Vítejte v Nexora Contact Center',`<div class="note-box">Propojený pracovní prostor zákaznické podpory, CRM a dokumentů. Tato ukázka běží lokálně a používá pouze fiktivní data.</div><div class="detail-properties"><div><div class="property-label">Rychlé hledání</div><div class="property-value">Ctrl + K / Cmd + K</div></div><div><div class="property-label">Zavřít okno</div><div class="property-value">Escape</div></div><div><div class="property-label">Vybrat výsledek hledání</div><div class="property-value">Šipky ↑ ↓ a Enter</div></div><div><div class="property-label">Otevřít kartu klávesnicí</div><div class="property-value">Tab, poté Enter</div></div></div><h3 class="section-title">Vyzkoušejte propojený postup</h3><p class="subtext" style="line-height:2">Otevřete zákazníka v CRM, založte požadavek a připojte dokument. Potom spusťte simulovaný hovor, uložte poznámku a naplánujte navazující úkol.</p><div class="divider"></div><p class="subtext" style="line-height:1.9">Změny se ukládají v prohlížeči. Skutečné hovory, e-maily, cloud, přihlášení ani týmová synchronizace nejsou připojené. Úplnou zálohu vytvoříte v Nastavení → Data a zabezpečení.</p>`,btn('Začínáme s Nexorou','open-article','book','soft','data-id="kb6"'))}
function integrationInfo(key){const info={telephony:['Telefonie / SIP PBX','Frontend potřebuje serverový adaptér pro vybranou ústřednu a autorizovaný signalizační kanál. Příchozí události se převádějí na záznamy hovorů; ovládací příkazy se odesílají ústředně.\n\nImplementujte ověření operátora, oprávnění k lince, stavový model hovoru, chybové stavy, obnovu spojení a soulad zpracování případných nahrávek s pravidly vaší organizace.','POST /api/calls\nPOST /api/calls/:id/answer\nPOST /api/calls/:id/hold\nPOST /api/calls/:id/transfer\nPOST /api/calls/:id/end\nWebSocket /api/call-events'],mail:['E-mailová schránka','Příjem zpráv musí obsluhovat autorizovaná serverová integrace. Před odesláním odpovědi ověřte oprávnění a příslušnost požadavku k pracovnímu prostoru.\n\nZpracujte deduplikaci zpráv, vazbu vláken, přílohy, stav doručení a selhání odeslání. Tajné údaje k poště nepatří do JavaScriptu v prohlížeči.','POST /api/inbound/email\nPOST /api/tickets/:id/replies\nGET /api/tickets/:id/messages\nGET /api/messages/:id/delivery'],backend:['Databáze a úložiště','Nahraďte lokální úložiště serverovou databází a chráněným objektovým úložištěm. Každý záznam musí mít identifikátor pracovního prostoru a serverově vynucený přístup.\n\nPro dokumenty navrhněte kontrolu typu a velikosti, bezpečnostní kontrolu souborů, verzování, audit, retenční pravidla a obnovitelné zálohy. Přidejte transakce a řešení souběžných změn.','GET /api/customers\nPOST /api/tickets\nPATCH /api/deals/:id\nPOST /api/documents/upload-intent\nPOST /api/documents/:id/versions\nGET /api/documents/:id/download'],auth:['Přihlášení a role','Přidejte skutečnou identitu uživatele, bezpečnou relaci a role ověřované serverem u každé operace. Skrytí tlačítka ve frontendové aplikaci není autorizace.\n\nDefinujte správce, vedoucího týmu a operátora. Oddělte zákaznický portál od interního prostoru. Zvažte vícefaktorové ověření a řešte ukončení relací i odebrání přístupu.','GET /api/session\nPOST /api/auth/login\nPOST /api/auth/logout\nGET /api/workspaces/:id/members\nPATCH /api/workspaces/:id/members/:id']};const [title,text,code]=info[key]||info.backend;infoModal(title,`<div class="info-banner">${icon('info')}<div><strong>Architektonický návrh, ne připojená integrace.</strong> Uvedená rozhraní jsou návrhem pro implementaci serveru, nikoli hotovým API.</div></div><p class="subtext" style="white-space:pre-line;line-height:1.95">${e(text)}</p><h3 class="section-title mt-24">Navržené rozhraní</h3><pre class="code-block">${e(code)}</pre>`, '',true)}
/* Binary exports and full-fidelity backups */
const crcTable=(()=>{const table=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;table[n]=c>>>0}return table})();
function crc32(bytes){let c=0xffffffff;for(const byte of bytes)c=crcTable[(c^byte)&255]^(c>>>8);return(c^0xffffffff)>>>0}
async function zipDocuments(){const docs=S.documents.filter(d=>U.docSelected.has(d.id));if(!docs.length)return;if(docs.reduce((s,d)=>s+d.size,0)>50*1024*1024)throw Error('Pro jeden ZIP vyberte nejvýše 50 MB souborů.');const parts=[],central=[],used=new Set();let offset=0;for(const d of docs){const blob=await docBlob(d),body=new Uint8Array(await blob.arrayBuffer());let name=d.name.replace(/[\\/:*?"<>|]/g,'_');if(used.has(name))name=d.id+'_'+name;used.add(name);const fn=new TextEncoder().encode(name),crc=crc32(body);const header=new Uint8Array(30+fn.length),v=new DataView(header.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x800,true);v.setUint16(12,33,true);v.setUint32(14,crc,true);v.setUint32(18,body.length,true);v.setUint32(22,body.length,true);v.setUint16(26,fn.length,true);header.set(fn,30);parts.push(header,body);const cen=new Uint8Array(46+fn.length),cv=new DataView(cen.buffer);cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0x800,true);cv.setUint16(14,33,true);cv.setUint32(16,crc,true);cv.setUint32(20,body.length,true);cv.setUint32(24,body.length,true);cv.setUint16(28,fn.length,true);cv.setUint32(42,offset,true);cen.set(fn,46);central.push(cen);offset+=header.length+body.length}const centralSize=central.reduce((s,x)=>s+x.length,0),end=new Uint8Array(22),ev=new DataView(end.buffer);ev.setUint32(0,0x06054b50,true);ev.setUint16(8,docs.length,true);ev.setUint16(10,docs.length,true);ev.setUint32(12,centralSize,true);ev.setUint32(16,offset,true);download(new Blob([...parts,...central,end],{type:'application/zip'}),'Nexora-dokumenty.zip');toast('ZIP s vybranými dokumenty je připravený.')}
function blobBase64(blob){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(String(fr.result).split(',')[1]);fr.onerror=()=>reject(Error('Soubor nelze zahrnout do zálohy.'));fr.readAsDataURL(blob)})}
function referencedFileIDs(state){return new Set(state.documents.flatMap(d=>[d.blobId,...(d.versions||[]).map(v=>v.blobId)]).filter(Boolean))}
async function exportBackup(){const refs=referencedFileIDs(S),files=[];for(const key of refs){const row=await getFile(key);if(!row?.blob)throw Error('Záloha byla zastavena: některý nahraný soubor chybí. Nahrajte jeho novou verzi nebo odeberte poškozený záznam.');files.push({id:key,type:row.blob.type,data:await blobBase64(row.blob)})}const backup={schema:'nexora-backup',version:1,exportedAt:new Date().toISOString(),state:clone(S),files};for(const c of backup.state.calls)if(c.status==='active')c.duration=callSeconds(c);download(new Blob([JSON.stringify(backup,null,2)],{type:'application/json;charset=utf-8'}),`Nexora-zaloha-${localDate()}.json`);toast('Úplná záloha včetně nahraných souborů je připravená.')}
function chooseBackup(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.style.display='none';document.body.append(input);input.addEventListener('cancel',()=>input.remove(),{once:true});input.onchange=async()=>{try{const file=input.files?.[0];if(!file)return;if(file.size>100*1024*1024)throw Error('Záloha přesahuje maximální velikost 100 MB.');const parsed=JSON.parse(await file.text());if(parsed.schema!=='nexora-backup'||parsed.version!==1||!Array.isArray(parsed.files))throw Error('Tento soubor není záloha aplikace Nexora.');validateState(parsed.state);validateImportedState(parsed.state);const files=new Map();for(const f of parsed.files){if(typeof f.id!=='string'||typeof f.data!=='string'||f.data.length>MAX_FILE*1.4||!/^[A-Za-z0-9+/]*={0,2}$/.test(f.data)||f.data.length%4!==0||files.has(f.id))throw Error('Záloha obsahuje neplatný soubor.');files.set(f.id,f)}for(const ref of referencedFileIDs(parsed.state))if(!files.has(ref))throw Error('Záloha neobsahuje všechny soubory dokumentů.');U.importCandidate=parsed;confirmModal('Obnovit pracovní prostor?',`Záloha obsahuje ${parsed.state.customers.length} zákazníků, ${parsed.state.tickets.length} požadavků a ${parsed.state.documents.length} dokumentů. Aktuální data budou nahrazena. Nejdříve si stáhněte jejich zálohu.`, 'perform-import','','Obnovit ze zálohy')}catch(err){toast(err.message||'Zálohu se nepodařilo načíst.','error')}finally{input.remove()}};input.click()}
function validateImportedState(s){const str=(v,max=30000)=>typeof v==='string'&&v.length<=max,finite=n=>typeof n==='number'&&Number.isFinite(n)&&n>=0;for(const a of s.agents)if(!str(a.name,100)||!str(a.email,200)||!str(a.role,120)||!str(a.team,120)||!agentStates[a.status]||!Array.isArray(a.skills)||!finite(a.handled)||!finite(a.csat)||a.csat>5)throw Error('Neplatný profil operátora v záloze.');for(const c of s.customers)if(!str(c.name,100)||!str(c.company,200)||!str(c.email,200)||!str(c.phone,50)||!Array.isArray(c.tags)||!Array.isArray(c.notes)||!finite(c.value))throw Error('Neplatný zákazník v záloze.');const customerIDs=new Set(s.customers.map(c=>c.id)),agentIDs=new Set(s.agents.map(a=>a.id));if(!agentIDs.has('a1'))throw Error('V záloze chybí hlavní demo profil.');for(const t of s.tickets){if(!str(t.subject,300)||!ticketStates[t.status]||!priorities[t.priority]||!channelNames[t.channel]||!finite(t.number)||!Array.isArray(t.messages)||!Array.isArray(t.events)||!Array.isArray(t.documents)||!customerIDs.has(t.customer)||!agentIDs.has(t.assignee)||!Number.isFinite(dateObj(t.due).getTime()))throw Error('Neplatný požadavek v záloze.');for(const m of t.messages)if(!str(m.text)||!str(m.author,100))throw Error('Neplatná konverzace v záloze.')}for(const d of s.deals)if(!str(d.title,300)||!stages[d.stage]||!finite(d.value)||!customerIDs.has(d.customer)||!agentIDs.has(d.owner))throw Error('Neplatná příležitost v záloze.');for(const d of s.documents)if(!str(d.name,300)||!folders.includes(d.folder)||!Array.isArray(d.versions)||!Array.isArray(d.tags)||!finite(d.size)||!finite(d.version)||!str(d.type,150))throw Error('Neplatný dokument v záloze.');for(const t of s.tasks)if(!str(t.title,300)||typeof t.done!=='boolean'||!priorities[t.priority]||!str(t.due,40)||!agentIDs.has(t.owner))throw Error('Neplatný úkol v záloze.');for(const a of s.articles)if(!str(a.title,300)||!str(a.summary,1000)||!str(a.content)||!finite(a.views)||!finite(a.helpful)||!finite(a.minutes))throw Error('Neplat case'confirm-delete-document':{const d=S.documents.find(x=>x.id===recordID);if(!d)return;const keys=new Set([d.blobId,...versionsOf(d).map(v=>v.blobId)].filter(Boolean));S.documents=S.documents.filter(x=>x.id!==d.id);for(const t of S.tickets){t.documents=t.documents.filter(x=>x!==d.id);for(const m of t.messages)if(m.documents)m.documents=m.documents.filter(x=>x!==d.id)}S.notifications=S.notifications.filter(n=>!(n.entity==='document'&&n.target===d.id));U.docSelected.delete(d.id);closeOverlay();commit('Dokument byl smazán.',`Smazán dokument ${d.name}.`,'trash');for(const k of keys)try{await deleteFile(k)}catch{}break}

case'export-deals':exportCSV(['Příležitost','Společnost','Fáze','Hodnota Kč','Pravděpodobnost','Vlastník','Uzavření','Poznámka'],S.deals.filter(d=>(U.pipelineOwner==='all'||d.owner===U.pipelineOwner)&&contains([d.title,customer(d.customer)?.company,customerName(d.customer)].join(' '),U.q)).map(d=>[d.title,customer(d.customer)?.company,stages[d.stage].name,d.value,stages[d.stage].prob,agentName(d.owner),d.due,d.note]),'Nexora-pipeline.csv');break;

default:console.warn('Unknown action',action)}

async function changeAction(el){const action=el.dataset.change,value=el.value,recordID=el.dataset.id;switch(action){
case'ticket-priority':U.ticketPriority=value;U.ticketPage=1;render();break;
case'ticket-owner':U.ticketOwner=value;U.ticketPage=1;render();break;
case'crm-status':U.crmStatus=value;U.crmPage=1;render();break;
case'crm-sort':U.crmSort=value;render();break;
case'pipeline-owner':U.pipelineOwner=value;render();break;
case'call-filter':U.callFilter=value;render();break;
case'doc-sort':U.docSort=value;render();break;
case'task-filter':U.taskFilter=value;render();break;
case'task-owner':U.taskOwner=value;render();break;
case'team-filter':U.teamFilter=value;render();break;
case'task-done':{const t=S.tasks.find(x=>x.id===recordID);if(t){t.done=el.checked;commit(t.done?'Úkol byl dokončen.':'Úkol je znovu otevřený.',`${t.done?'Dokončen':'Znovu otevřen'} úkol: ${t.title}.`,'check-circle')}break}
case'doc-select':el.checked?U.docSelected.add(recordID):U.docSelected.delete(recordID);render();break;
case'doc-select-all':for(const d of filteredDocuments())el.checked?U.docSelected.add(d.id):U.docSelected.delete(d.id);render();break;
case'ticket-status':changeTicketStatus(S.tickets.find(t=>t.id===recordID),value);break;
case'ticket-assignee':{const t=S.tickets.find(x=>x.id===recordID);if(t&&agent(value)){t.assignee=value;t.events.push({text:'Řešitel změněn: '+agentName(value)+'.',at:iso()});commit('Řešitel byl změněn.');openTicket(t.id)}break}
case'ticket-set-priority':{const t=S.tickets.find(x=>x.id===recordID);if(t&&priorities[value]){t.priority=value;t.events.push({text:'Priorita změněna: '+priorities[value]+'. Termín SLA zůstává zachovaný.',at:iso()});commit('Priorita byla změněna. Termín SLA zůstává zachovaný.');openTicket(t.id)}break}
case'preference':if(Object.hasOwn(S.preferences,el.dataset.key)){S.preferences[el.dataset.key]=el.checked;save();toast('Nastavení bylo uloženo.')}break;
case'agent-status':{const a=agent(recordID);if(!a||!agentStates[value])return;if(value!=='busy'&&S.calls.some(c=>c.status==='active'&&c.agent===a.id)){render();toast('Nejprve ukončete nebo předejte simulovaný hovor tohoto operátora.','error');return}a.status=value;commit('Dostupnost byla upravena.');break}
case'dial-customer':{const c=customer(value);if(c&&$('#f-number'))$('#f-number').value=c.phone;break}
}
}
document.addEventListener('click',async event=>{if(event.target.matches('[data-overlay-background]')){closeOverlay();return}const el=event.target.closest('[data-action]');if(!el||el.disabled)return;if(Date.now()-(U.lastDrag||0)<250&&el.dataset.action==='edit-deal')return;event.preventDefault();try{await clickAction(el)}catch(err){console.error(err);toast(err.message||'Operaci se nepodařilo dokončit.','error')}});
document.addEventListener('submit',async event=>{const form=event.target.closest('form[data-form]');if(!form)return;event.preventDefault();const button=$('button[type=submit]',form);if(form.dataset.pending==='true')return;form.dataset.pending='true';if(button)button.disabled=true;try{await handleForm(form)}catch(err){console.error(err);formError(form,err)}finally{form.dataset.pending='false';if(button?.isConnected)button.disabled=false}});
document.addEventListener('change',async event=>{if(event.target.id==='upload-files'){selectFiles(Array.from(event.target.files||[]));event.target.value='';return}if(event.target.id==='f-priority'&&event.target.closest('[data-form="new-ticket"]')){const minutes=({urgent:30,high:120,normal:480,low:1440})[event.target.value];if(minutes&&$('#f-due'))$('#f-due').value=inputDT(new Date(now().getTime()+minutes*60000));return}const el=event.target.closest('[data-change]');if(el)try{await changeAction(el)}catch(err){toast(err.message||'Nastavení nelze změnit.','error')}});
document.addEventListener('input',event=>{const el=event.target;if(el.dataset.filter==='query'){clearTimeout(filterTimer);const q=el.value;filterTimer=setTimeout(()=>{U.q=q;U.ticketPage=1;U.crmPage=1;render()},100)}else if(el.dataset.input==='global-search'){U.searchIndex=0;renderSearchResults(el.value)}else if(el.dataset.input==='message-draft'){U.drafts[el.dataset.id]=el.value}});
document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();openSearch();return}if(event.key==='Escape'){if($('#overlay-root').children.length)closeOverlay();else if($('#popover-root').children.length)closePopover();else if(U.mobile){U.mobile=false;render()}return}if($('#global-search')){if(['ArrowDown','ArrowUp','Enter'].includes(event.key)&&!event.altKey&&!event.ctrlKey&&!event.metaKey){event.preventDefault();if(event.key==='Enter'){openSearchResult(U.searchIndex);return}const length=U.searchResults?.length||0;U.searchIndex=length?(U.searchIndex+(event.key==='ArrowDown'?1:-1)+length)%length:0;renderSearchResults($('#global-search').value);$('#search-result-'+U.searchIndex)?.scrollIntoView({block:'nearest'});return}}if(event.key==='Tab'&&$('#overlay-root').children.length){const focusable=$$('button:not([disabled]),a[href],input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),[tabindex="0"]',$('#overlay-root')).filter(x=>x.getClientRects().length&&!x.closest('.hidden'));if(focusable.length){const first=focusable[0],last=focusable.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}}const actionable=event.target.closest('[role="button"][data-action]');if(actionable&&(event.key==='Enter'||event.key===' ')){event.preventDefault();clickAction(actionable).catch(err=>toast(err.message,'error'))}if(event.target.id==='dial-number'&&event.key==='Enter'){event.preventDefault();startCall(event.target.value)}});
document.addEventListener('dragstart',event=>{const card=event.target.closest('[data-deal-drag]');if(!card)return;event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/x-nexora-deal',card.dataset.dealDrag);event.dataTransfer.setData('text/plain',card.dataset.dealDrag);card.classList.add('dragging')});
document.addEventListener('dragend',()=>{$$('.dragging,.drag-over').forEach(x=>x.classList.remove('dragging','drag-over'));U.lastDrag=Date.now()});
document.addEventListener('dragover',event=>{const target=event.target.closest('[data-drop-stage],#dropzone');if(target){event.preventDefault();target.classList.add('drag-over');event.dataTransfer.dropEffect=target.id==='dropzone'?'copy':'move'}else if(event.dataTransfer?.types.includes('Files'))event.preventDefault()});
document.addEventListener('dragleave',event=>{const target=event.target.closest('[data-drop-stage],#dropzone');if(target&&!target.contains(event.relatedTarget))target.classList.remove('drag-over')});
document.addEventListener('drop',event=>{const target=event.target.closest('[data-drop-stage],#dropzone');if(event.dataTransfer?.types.includes('Files'))event.preventDefault();if(!target)return;event.preventDefault();target.classList.remove('drag-over');if(target.id==='dropzone')selectFiles(Array.from(event.dataTransfer.files||[]));else{const dealID=event.dataTransfer.getData('text/x-nexora-deal');if(dealID){U.lastDrag=Date.now();moveDeal(dealID,target.dataset.dropStage)}}});
document.addEventListener('pointermove',event=>{const point=event.target.closest('[data-chart-label]');if(!point)return;const wrap=point.closest('.chart-wrap'),tip=$('.chart-tooltip',wrap),rect=wrap.getBoundingClientRect();tip.innerHTML=`<strong>${e(point.dataset.chartLabel)}</strong><br>Příchozí: ${e(point.dataset.a)} · Zpracované: ${e(point.dataset.b)}`;tip.style.display='block';tip.style.top=Math.max(0,event.clientY-rect.top-55)+'px';tip.style.left=Math.max(0,Math.min(rect.width-210,event.clientX-rect.left-80))+'px'});
document.addEventListener('pointerout',event=>{if(event.target.closest('[data-chart-label]')&&!event.relatedTarget?.closest('[data-chart-label]'))$$('.chart-tooltip').forEach(el=>el.style.display='none')});
window.addEventListener('hashchange',handleRoute);
window.addEventListener('beforeunload',()=>{for(const c of S.calls)if(c.status==='active'){c.duration=callSeconds(c);liveStarts.set(c.id,Date.now())}save()});
setInterval(()=>{$$('[data-timer]').forEach(el=>{const c=S.calls.find(c=>c.id===el.dataset.timer&&c.status==='active');if(c)el.textContent=duration(callSeconds(c))})},1000);
// Typed diagnostics for local testing; no external communication or credentials.
window.Nexora={version:'1.0.0',snapshot:()=>clone(S),navigate,storageKey:STORE};
handleRoute();
if(storageWarning)setTimeout(()=>toast(storageWarning,'error'),500);
})();
